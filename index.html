<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>短網址分潤檢測工具</title>
    <style>
        body {
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f7fb;
        }
        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            font-size: 1.8rem;
            margin-top: 0;
            color: #1e293b;
        }
        .note {
            background: #fef9e3;
            border-left: 5px solid #f59e0b;
            padding: 12px 16px;
            font-size: 0.85rem;
            margin-bottom: 24px;
            border-radius: 12px;
        }
        label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 16px;
            box-sizing: border-box;
            font-family: monospace;
        }
        button {
            margin-top: 18px;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        button:hover {
            background: #2563eb;
        }
        .result {
            margin-top: 28px;
            padding: 16px;
            border-radius: 20px;
            background: #f1f5f9;
            word-break: break-all;
        }
        .badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .affiliate {
            background: #fee2e2;
            color: #b91c1c;
        }
        .safe {
            background: #dcfce7;
            color: #15803d;
        }
        .error {
            background: #ffedd5;
            color: #9a3412;
        }
        hr {
            margin: 16px 0;
        }
        footer {
            margin-top: 20px;
            font-size: 0.75rem;
            text-align: center;
            color: #475569;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>🔗 短網址分潤檢測</h1>
    <div class="note">
        ⚠️ 注意：此工具會解析短網址的最終跳轉目標，並檢查是否有分潤參數。<br>
        若偵測失敗，請手動點擊短網址，再觀察最終網址列中的參數。
    </div>

    <label>📎 貼上短網址</label>
    <input type="text" id="shortUrl" placeholder="例如: https://coupa.ng/xxxxxx" value="https://coupa.ng/cm3Z43?abTestInfo=100412_group_A">
    <button id="checkBtn">🔍 解析並判斷分潤</button>

    <div id="resultArea" class="result" style="display: none;"></div>
    <footer>💡 分潤特徵關鍵字：affiliate, ref, partner, click_id, utm_source, af_sub5, settlement 等</footer>
</div>

<script>
    // 分潤關鍵字（更新版：加入 Coupang 常見分潤參數）
    const AFFILIATE_KEYWORDS = [
        // 通用分潤
        'affiliate', 'aff_id', 'affid', 'affiliate_id', 'af_',
        'ref', 'referral', 'referrer',
        'partner', 'partner_id', 'pub_id',
        'click_id', 'clickid',
        'utm_source', 'utm_medium',
        'tag', 'sr', 'afp', 'afftrack', 'sid', 'subid',
        // Coupang 特定
        'af_sub5',      // 重要！CSHARESDP 會出現在這裡
        'settlement',   // settlement=N 表示無分潤
        'cshare', 'share', 'social'
    ];

    // 特殊分潤值檢測（例如 af_sub5=CSHARESDP）
    function hasAffiliateValue(params) {
        for (let [key, value] of params.entries()) {
            const lowerKey = key.toLowerCase();
            const lowerValue = value.toLowerCase();
            
            // 檢查 af_sub5 是否包含 SHARE 或 REF 等關鍵字
            if (lowerKey === 'af_sub5') {
                if (lowerValue.includes('share') || lowerValue.includes('ref') || lowerValue.includes('social')) {
                    return { key, value, reason: 'af_sub5 參數包含分潤關鍵字' };
                }
            }
            
            // 檢查 settlement=N（無分潤標記，反向邏輯）
            if (lowerKey === 'settlement' && lowerValue === 'n') {
                return { key, value, reason: 'settlement=N 可能表示不結算分潤', isNonAffiliate: true };
            }
            
            // 檢查 utm_source 是否為分潤來源
            if (lowerKey === 'utm_source') {
                if (lowerValue.includes('aff') || lowerValue.includes('partner') || lowerValue.includes('ref')) {
                    return { key, value, reason: 'utm_source 為分潤來源' };
                }
            }
        }
        return null;
    }

    function parseFinalUrl(finalUrl) {
        try {
            const urlObj = new URL(finalUrl);
            const params = urlObj.searchParams;
            const foundParams = [];
            let isAffiliate = false;
            let nonAffiliateFlag = false;

            // 一般關鍵字檢查
            for (let [key, value] of params.entries()) {
                const lowerKey = key.toLowerCase();
                if (AFFILIATE_KEYWORDS.some(kw => lowerKey.includes(kw))) {
                    foundParams.push({ key, value, reason: '參數名稱包含分潤關鍵字' });
                    isAffiliate = true;
                }
            }
            
            // 特殊值檢查（例如 af_sub5=CSHARESDP）
            const specialCheck = hasAffiliateValue(params);
            if (specialCheck) {
                if (specialCheck.isNonAffiliate) {
                    nonAffiliateFlag = true;
                    foundParams.push({ key: specialCheck.key, value: specialCheck.value, reason: specialCheck.reason });
                } else {
                    isAffiliate = true;
                    foundParams.push({ key: specialCheck.key, value: specialCheck.value, reason: specialCheck.reason });
                }
            }
            
            // 如果有 settlement=N 且沒有其他分潤證據，判定為無分潤
            if (nonAffiliateFlag && !isAffiliate) {
                isAffiliate = false;
            }
            
            return { foundParams, isAffiliate, fullUrl: finalUrl };
        } catch(e) {
            return { foundParams: [], isAffiliate: false, fullUrl: finalUrl };
        }
    }

    async function getFinalUrl(shortUrl) {
        const apiUrl = `https://unshorten.me/json/${encodeURIComponent(shortUrl)}`;
        const response = await fetch(apiUrl);
        const data = await response.json();
        if (data && data.resolved_url) {
            return data.resolved_url;
        } else {
            throw new Error('無法解析短網址');
        }
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    async function handleCheck() {
        const input = document.getElementById('shortUrl').value.trim();
        if (!input) {
            alert('請輸入短網址');
            return;
        }

        let urlToCheck = input;
        if (!urlToCheck.startsWith('http://') && !urlToCheck.startsWith('https://')) {
            urlToCheck = 'https://' + urlToCheck;
        }

        const resultDiv = document.getElementById('resultArea');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `<div>⏳ 解析中，請稍候...</div>`;

        try {
            const finalUrl = await getFinalUrl(urlToCheck);
            const analysis = parseFinalUrl(finalUrl);
            
            const badgeClass = analysis.isAffiliate ? 'affiliate' : 'safe';
            const badgeText = analysis.isAffiliate ? '⚠️ 偵測到分潤跡象' : '✅ 無明顯分潤特徵';

            let paramsHtml = '';
            if (analysis.foundParams.length > 0) {
                paramsHtml = `<div style="margin-top: 12px;"><strong>🔎 可疑參數：</strong><ul style="margin-top: 8px;">` +
                    analysis.foundParams.map(p => `<li><code>${p.key}=${p.value}</code><br> <span style="font-size:0.75rem;">➜ ${p.reason}</span></li>`).join('') +
                    `</ul></div>`;
            } else {
                paramsHtml = `<div style="margin-top: 12px;">✔️ 未發現典型分潤參數</div>`;
            }

            resultDiv.innerHTML = `
                <div class="badge ${badgeClass}">${badgeText}</div>
                <div><strong>🔗 最終網址：</strong><br><span style="font-size:0.8rem;">${escapeHtml(analysis.fullUrl)}</span></div>
                <hr>
                ${paramsHtml}
            `;
        } catch(err) {
            resultDiv.innerHTML = `<div class="badge error">❌ 偵測失敗</div>
                                   <div>${escapeHtml(err.message)}</div>
                                   <div style="margin-top:12px;">👉 請手動點擊短網址，查看最終網址列中的參數。</div>`;
        }
    }

    document.getElementById('checkBtn').addEventListener('click', handleCheck);
</script>
</body>
</html>
