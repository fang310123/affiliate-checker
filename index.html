<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>短網址/長網址 分潤檢測工具</title>
    <style>
        /* ... (樣式與之前相同，保持版面整潔) ... */
        body { font-family: system-ui, 'Segoe UI', Roboto, sans-serif; max-width: 700px; margin: 50px auto; padding: 20px; background: #f5f7fb; }
        .card { background: white; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 30px; }
        h1 { font-size: 1.8rem; margin-top: 0; color: #1e293b; }
        .note { background: #fef9e3; border-left: 5px solid #f59e0b; padding: 12px 16px; font-size: 0.85rem; margin-bottom: 24px; border-radius: 12px; }
        label { font-weight: 600; display: block; margin-bottom: 8px; }
        input { width: 100%; padding: 14px; font-size: 1rem; border: 1px solid #cbd5e1; border-radius: 16px; box-sizing: border-box; font-family: monospace; }
        button { margin-top: 18px; background: #3b82f6; color: white; border: none; padding: 12px 24px; font-size: 1rem; border-radius: 40px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #2563eb; }
        .result { margin-top: 28px; padding: 16px; border-radius: 20px; background: #f1f5f9; word-break: break-all; }
        .badge { display: inline-block; padding: 6px 14px; border-radius: 40px; font-size: 0.8rem; font-weight: bold; margin-bottom: 12px; }
        .affiliate { background: #fee2e2; color: #b91c1c; }
        .safe { background: #dcfce7; color: #15803d; }
        .error { background: #ffedd5; color: #9a3412; }
        hr { margin: 16px 0; }
        footer { margin-top: 20px; font-size: 0.75rem; text-align: center; color: #475569; }
    </style>
</head>
<body>
<div class="card">
    <h1>🔗 分潤鏈結檢測助手</h1>
    <div class="note">
        💡 <strong>使用說明</strong><br>
        1. 貼上「<strong>完整的商品頁網址</strong>」 (例如 www.tw.coupang.com/...) 或「<strong>短網址</strong>」 (例如 coupa.ng/...)。<br>
        2. 若偵測短網址失敗，請直接將瀏覽器最終到達的「<strong>完整商品頁網址</strong>」貼入檢測，結果最準確。
    </div>

    <label>📎 貼上網址進行檢測</label>
    <input type="text" id="urlInput" placeholder="貼上 coupa.ng 短網址 或 www.tw.coupang.com 商品網址">
    <button id="checkBtn">🔍 檢測分潤</button>

    <div id="resultArea" class="result" style="display: none;"></div>
    <footer>🔎 支援偵測參數：<code>af_sub5</code>, <code>settlement</code>, <code>ref</code>, <code>affiliate</code>, <code>partner</code> 等。</footer>
</div>

<script>
    // 增強版分潤關鍵字庫
    const AFFILIATE_PATTERNS = [
        // 參數名稱
        { type: 'param', keywords: ['affiliate', 'aff_id', 'af_', 'ref', 'referral', 'partner', 'click_id', 'utm_source', 'sid', 'subid'] },
        // Coupang 特殊規則
        { type: 'coupang_af_sub5', param: 'af_sub5', affValues: ['share', 'ref', 'social'] },
        { type: 'coupang_settlement', param: 'settlement', nonAffValue: 'n' }
    ];

    function analyzeUrl(targetUrl) {
        try {
            const url = new URL(targetUrl);
            const params = url.searchParams;
            const found = [];
            let isAffiliate = false;

            // 1. 檢查參數名稱
            for (let [key, value] of params.entries()) {
                const lowerKey = key.toLowerCase();
                if (AFFILIATE_PATTERNS.some(p => p.type === 'param' && p.keywords.some(kw => lowerKey.includes(kw)))) {
                    found.push({ key, value, reason: `參數名稱 "${key}" 為常見分潤標記` });
                    isAffiliate = true;
                }
            }

            // 2. 檢查 Coupang 的 af_sub5
            const afSub5 = params.get('af_sub5');
            if (afSub5) {
                const lowerVal = afSub5.toLowerCase();
                if (lowerVal.includes('share') || lowerVal.includes('ref')) {
                    found.push({ key: 'af_sub5', value: afSub5, reason: `🔥 Coupang 分潤關鍵參數值為 "${afSub5}"` });
                    isAffiliate = true;
                } else {
                    found.push({ key: 'af_sub5', value: afSub5, reason: `參數值為 "${afSub5}"，無明顯分潤特徵` });
                }
            }

            // 3. 檢查 Coupang 的 settlement
            const settlement = params.get('settlement');
            if (settlement && settlement.toLowerCase() === 'n') {
                found.push({ key: 'settlement', value: settlement, reason: `參數值為 "N"，可能表示「不結算分潤」` });
                // 注意：這裡不將 isAffiliate 設為 true
            }

            // 4. 特殊最終判斷：如果有 settlement=N 但沒有其他分潤證據，則判定為無分潤
            const hasSettlementN = settlement && settlement.toLowerCase() === 'n';
            const hasOtherAffiliateEvidence = isAffiliate;
            
            let finalVerdict = isAffiliate;
            if (hasSettlementN && !hasOtherAffiliateEvidence) {
                finalVerdict = false; // 只有 settlement=N 沒有其他證據，判定安全
            }

            return { isAffiliate: finalVerdict, foundParams: found, fullUrl: targetUrl };
        } catch (e) {
            return { isAffiliate: false, foundParams: [], fullUrl: targetUrl, error: 'URL 解析失敗' };
        }
    }

    async function resolveShortUrl(shortUrl) {
        const apiUrl = `https://unshorten.me/json/${encodeURIComponent(shortUrl)}`;
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('無法連線解析服務');
        const data = await response.json();
        if (data && data.resolved_url) {
            return data.resolved_url;
        } else {
            throw new Error('無法解析此短網址，請手動複製最終網址');
        }
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    async function handleCheck() {
        const input = document.getElementById('urlInput').value.trim();
        if (!input) {
            alert('請輸入或貼上網址');
            return;
        }

        let urlToCheck = input;
        if (!urlToCheck.startsWith('http://') && !urlToCheck.startsWith('https://')) {
            urlToCheck = 'https://' + urlToCheck;
        }

        const resultDiv = document.getElementById('resultArea');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `<div>⏳ 檢測中...</div>`;

        try {
            let finalUrl = urlToCheck;
            // 如果是短網址，嘗試解析
            if (urlToCheck.includes('coupa.ng') || urlToCheck.includes('bit.ly') || urlToCheck.includes('tinyurl')) {
                resultDiv.innerHTML = `<div>⏳ 偵測到短網址，嘗試解析真實目標...</div>`;
                finalUrl = await resolveShortUrl(urlToCheck);
            }
            
            const analysis = analyzeUrl(finalUrl);
            const badgeClass = analysis.isAffiliate ? 'affiliate' : 'safe';
            const badgeText = analysis.isAffiliate ? '⚠️ 偵測到分潤跡象' : '✅ 無明顯分潤特徵';

            let paramsHtml = '';
            if (analysis.foundParams.length > 0) {
                paramsHtml = `<div style="margin-top: 12px;"><strong>🔎 參數分析：</strong><ul style="margin-top: 8px;">` +
                    analysis.foundParams.map(p => `<li><code>${p.key}=${p.value}</code><br> <span style="font-size:0.75rem;">➜ ${p.reason}</span></li>`).join('') +
                    `</ul></div>`;
            } else {
                paramsHtml = `<div style="margin-top: 12px;">✔️ 未發現典型分潤參數</div>`;
            }

            resultDiv.innerHTML = `
                <div class="badge ${badgeClass}">${badgeText}</div>
                <div><strong>🔗 檢測網址：</strong><br><span style="font-size:0.8rem;">${escapeHtml(analysis.fullUrl)}</span></div>
                <hr>
                ${paramsHtml}
                <div style="margin-top:12px; font-size:0.8rem; color:#475569;">
                📌 <strong>如何手動確認？</strong><br>
                若對自動結果有疑慮，可直接複製瀏覽器網址列的「<strong>完整商品頁網址</strong>」再次檢測。
                </div>
            `;
        } catch(err) {
            resultDiv.innerHTML = `<div class="badge error">❌ 檢測失敗</div>
                                   <div>${escapeHtml(err.message)}</div>
                                   <div style="margin-top:12px;">👉 <strong>替代方案：</strong>請手動點擊短網址，待商品頁面載入後，<br>
                                   複製瀏覽器上方的「<strong>完整商品頁網址</strong>」，再貼回此工具檢測。</div>`;
        }
    }

    document.getElementById('checkBtn').addEventListener('click', handleCheck);
</script>
</body>
</html>
